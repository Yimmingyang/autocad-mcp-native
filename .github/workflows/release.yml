name: Windows installer release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run release checks
        shell: pwsh
        run: |
          npm ci
          npm test
          npm run check
          dotnet run --project test/InstallerCompatibility.Tests.csproj -c Release

      - name: Publish self-contained single-file installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          dotnet publish installer/AutoCadMcpInstaller.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=$version `
            -o dist/installer
          if (!(Test-Path dist/installer/AutoCadMcpInstaller.exe)) { throw 'Installer executable was not produced.' }
          New-Item -ItemType Directory -Path dist/release -Force | Out-Null
          Copy-Item dist/installer/AutoCadMcpInstaller.exe dist/release/AutoCadMcpInstaller.exe

      - name: Package installer source and MCP service
        shell: pwsh
        run: |
          git archive --format=zip --output=dist/release/autocad-mcp-source.zip HEAD
          Compress-Archive -Path package.json,package-lock.json,src -DestinationPath dist/release/autocad-mcp-server.zip -CompressionLevel Optimal
          foreach ($file in Get-ChildItem dist/release -File) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)" | Set-Content -LiteralPath ($file.FullName + '.sha256') -Encoding ascii
          }

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          name: AutoCAD MCP ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/release/AutoCadMcpInstaller.exe
            dist/release/AutoCadMcpInstaller.exe.sha256
            dist/release/autocad-mcp-source.zip
            dist/release/autocad-mcp-source.zip.sha256
            dist/release/autocad-mcp-server.zip
            dist/release/autocad-mcp-server.zip.sha256
