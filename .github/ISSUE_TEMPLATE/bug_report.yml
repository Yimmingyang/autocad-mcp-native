name: Bug report
description: Report a reproducible defect
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: autocad
    attributes:
      label: AutoCAD version and update
      placeholder: AutoCAD 2025, full version/build
    validations:
      required: true
  - type: input
    id: mcp
    attributes:
      label: MCP client and Node.js version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove personal paths, tokens, client drawings, and other private data.
